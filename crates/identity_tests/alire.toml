name = "identity_tests"
description = "AUnit tests for identity"
version = "1.0.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/bracke/identity"
tags = ["identity", "tests"]

executables = ["identity_tests", "identity_coverage"]
project-files = ["identity_tests.gpr"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
aunit = "*"

[[depends-on]]
identity = "*"

# Shared check-program helpers: process spawning, directory walks and text
# searches used by the code-coverage tool (identity_coverage).
[[depends-on]]
project_tools = "*"

[[pins]]
identity = { path = "../.." }

# Pins are root-only in Alire: this root builds identity, which depends on
# cryptolib, so it must pin cryptolib too.
[[pins]]
cryptolib = { path = "../../../cryptolib" }

[[pins]]
project_tools = { path = "../../../project_tools" }

[build-profiles]
"*" = "development"
