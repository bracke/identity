name = "identity_examples"
description = "Transport-neutral examples for identity"
version = "1.0.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/bracke/identity"
tags = ["identity", "examples"]

executables = ["identity_lifecycle"]
project-files = ["identity_examples.gpr"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
identity = "*"

[[pins]]
identity = { path = "../.." }

# Pins are root-only in Alire: this root builds identity, which depends on
# cryptolib, so it must pin cryptolib too.
[[pins]]
cryptolib = { path = "../../../cryptolib" }

[build-profiles]
"*" = "development"
