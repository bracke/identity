name = "identity_tools"
description = "Release and registry tooling entry points for identity"
version = "1.0.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/bracke/identity"
tags = ["identity", "tools"]

executables = ["identity_tools"]
project-files = ["identity_tools.gpr"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
identity = "*"

# Shared check-program helpers: text searches, file reads, and the
# generated-document currency check this crate uses to keep the gates
# document's stated numbers from drifting away from the tool's output.
[[depends-on]]
project_tools = "*"

[[pins]]
identity = { path = "../.." }

# Pins are root-only in Alire: this root builds identity, which depends on
# cryptolib, so it must pin cryptolib too.
[[pins]]
cryptolib = { path = "../../../cryptolib" }

[[pins]]
project_tools = { path = "../../../project_tools" }

[build-profiles]
"*" = "development"
