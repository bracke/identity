name = "identity_conformance"
description = "Repository conformance harness entry points for identity"
version = "1.0.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/bracke/identity"
tags = ["identity", "conformance"]

executables = ["identity_conformance"]
project-files = ["identity_conformance.gpr"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
identity = "*"

[[pins]]
identity = { path = "../.." }

# Pins are root-only in Alire: this root builds identity, which depends on
# cryptolib, so it must pin cryptolib too.
[[pins]]
cryptolib = { path = "../../../cryptolib" }

[build-profiles]
"*" = "development"
