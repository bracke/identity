name: release-check

# The release gate. The release_check tool (crates/identity_release_check)
# builds the library, runs every suite, records each run's real outcome under
# generated/evidence/, and only then runs identity_tools to validate the
# registries and generate the release reports from that evidence. Nothing here
# re-implements those checks: if this workflow and the tool ever disagree, the
# tool is the definition.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out identity
        uses: actions/checkout@v7
        with:
          path: identity

      # cryptolib is a path-pinned sibling of this crate, so the checkout has
      # to reproduce that layout: ../cryptolib relative to the identity root.
      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: identity

      - name: Install Alire
        uses: alire-project/setup-alire@v6
        with:
          version: 2.1.0

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Report toolchain
        working-directory: identity
        run: |
          alr --version
          alr toolchain --select --none || true
          gnatprove --version || echo "gnatprove not on PATH yet"

      # GNATprove ships with the FSF toolchain via Alire; the proof gate fails
      # closed if it is genuinely unavailable, so surface that here rather than
      # letting the gate report a confusing "not installed".
      - name: Install GNATprove
        working-directory: identity
        run: alr install gnatprove || true

      - name: Run the release check
        working-directory: identity
        run: |
          export PATH="$HOME/.alire/bin:$PATH"
          (cd crates/identity_release_check && alr -n build)
          ./crates/identity_release_check/bin/release_check

      # The evidence and generated reports are what the gate actually asserts
      # on, so keep them for any run that needs explaining.
      - name: Upload evidence and release reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: |
            identity/generated/evidence/
            identity/generated/release/
          if-no-files-found: warn
