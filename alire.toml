name = "identity"
description = "Transport-neutral Ada Identity and Authentication library"
version = "1.0.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/bracke/identity"
long-description = "identity is an Ada 2022 crate for transport-neutral identity and authentication contracts. The V1 boundary keeps authentication facts separate from authorization: no roles, permissions, tenant memberships, delegation, impersonation, scopes, obligations, overrides, or enforcement receipts are modeled in this crate."
tags = ["identity", "authentication", "security", "library"]

project-files = ["identity.gpr"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
cryptolib = "*"

[[pins]]
cryptolib = { path = "../cryptolib" }

[[actions]]
type = "test"
command = ["sh", "-c", "cd crates/identity_tests && alr build && ./bin/identity_tests"]

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so every root in the workspace shares object files instead of
# forcing a full rebuild of shared dependencies on each switch.
[build-profiles]
"*" = "development"
